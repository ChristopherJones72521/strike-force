<!-- Session Summary View -->
<style>
    .summary-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(8px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 50;
    }

    .summary-card {
        background-color: rgb(17, 24, 39);
        border-radius: 1rem;
        padding: 2rem;
        width: 90%;
        max-width: 600px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        position: relative;
    }

    .summary-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .summary-title {
        font-size: 1.5rem;
        font-weight: 700;
        color: white;
        margin-bottom: 0.5rem;
    }

    .summary-subtitle {
        font-size: 0.875rem;
        color: rgba(255, 255, 255, 0.6);
    }

    .metrics-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
        margin-bottom: 2rem;
    }

    .metric-item {
        background-color: rgba(255, 255, 255, 0.05);
        padding: 1rem;
        border-radius: 0.75rem;
        text-align: center;
    }

    .metric-value {
        font-size: 1.5rem;
        font-weight: 700;
        color: white;
        margin-bottom: 0.25rem;
    }

    .metric-label {
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.6);
    }

    .achievement {
        background: linear-gradient(45deg, #4f46e5, #7c3aed);
        padding: 1rem;
        border-radius: 0.75rem;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        gap: 1rem;
    }

    .achievement-icon {
        width: 2.5rem;
        height: 2.5rem;
        background-color: rgba(255, 255, 255, 0.2);
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .achievement-text {
        flex: 1;
    }

    .achievement-title {
        color: white;
        font-weight: 600;
        margin-bottom: 0.25rem;
    }

    .achievement-desc {
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.875rem;
    }

    .summary-actions {
        display: flex;
        gap: 1rem;
        margin-top: 2rem;
    }

    .summary-button {
        flex: 1;
        padding: 0.75rem;
        border-radius: 0.5rem;
        font-weight: 600;
        text-align: center;
        transition: all 200ms;
    }

    .primary-button {
        background-color: rgb(99, 102, 241);
        color: white;
    }

    .primary-button:hover {
        background-color: rgb(79, 70, 229);
    }

    .secondary-button {
        background-color: rgba(255, 255, 255, 0.1);
        color: white;
    }

    .secondary-button:hover {
        background-color: rgba(255, 255, 255, 0.15);
    }

    .share-options {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-top: 1rem;
    }

    .share-button {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: rgba(255, 255, 255, 0.1);
        color: white;
        transition: all 200ms;
    }

    .share-button:hover {
        background-color: rgba(255, 255, 255, 0.2);
        transform: scale(1.05);
    }

    .progress-ring {
        position: relative;
        width: 120px;
        height: 120px;
        margin: 0 auto 1.5rem;
    }

    .progress-ring__circle {
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
    }

    .progress-ring__text {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: white;
    }

    .progress-ring__percent {
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 0.25rem;
    }

    .progress-ring__label {
        font-size: 0.75rem;
        color: rgba(255, 255, 255, 0.6);
    }
</style>

<template id="sessionSummaryTemplate">
    <div class="summary-overlay">
        <div class="summary-card">
            <!-- Header -->
            <div class="summary-header">
                <h2 class="summary-title">Session Complete! 🎉</h2>
                <p class="summary-subtitle">Here's how you did</p>
            </div>

            <!-- Progress Ring -->
            <div class="progress-ring">
                <svg width="120" height="120">
                    <circle cx="60" cy="60" r="54" stroke="rgba(255,255,255,0.1)" stroke-width="6" fill="none"/>
                    <circle class="progress-ring__circle" cx="60" cy="60" r="54" stroke="#4f46e5" stroke-width="6" fill="none" 
                           stroke-dasharray="339.292" stroke-dashoffset="0"/>
                </svg>
                <div class="progress-ring__text">
                    <div class="progress-ring__percent">85%</div>
                    <div class="progress-ring__label">of goal</div>
                </div>
            </div>

            <!-- Metrics Grid -->
            <div class="metrics-grid">
                <div class="metric-item">
                    <div class="metric-value" id="summaryMaxForce">0.0</div>
                    <div class="metric-label">Max Force (G)</div>
                </div>
                <div class="metric-item">
                    <div class="metric-value" id="summaryPunchCount">0</div>
                    <div class="metric-label">Total Punches</div>
                </div>
                <div class="metric-item">
                    <div class="metric-value" id="summaryAvgForce">0.0</div>
                    <div class="metric-label">Avg Force (G)</div>
                </div>
                <div class="metric-item">
                    <div class="metric-value" id="summaryDuration">0:00</div>
                    <div class="metric-label">Duration</div>
                </div>
            </div>

            <!-- Achievements -->
            <div id="achievementsContainer">
                <!-- Achievements will be inserted here -->
            </div>

            <!-- Actions -->
            <div class="summary-actions">
                <button class="summary-button secondary-button" onclick="window.closeSummary()">
                    Close
                </button>
                <button class="summary-button primary-button" onclick="window.shareSession()">
                    Share Results
                </button>
            </div>

            <!-- Share Options (hidden by default) -->
            <div class="share-options" style="display: none;" id="shareOptions">
                <button class="share-button" title="Share to Instagram" onclick="window.shareToSocial('instagram')">
                    <i data-feather="instagram"></i>
                </button>
                <button class="share-button" title="Share to Strava" onclick="window.shareToSocial('strava')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066m-7.008-5.599l2.836 5.598h4.172L10.463 0l-7.01 13.828h4.172"/>
                    </svg>
                </button>
                <button class="share-button" title="Copy Link" onclick="window.copySessionLink()">
                    <i data-feather="link"></i>
                </button>
            </div>
        </div>
    </div>
</template>
