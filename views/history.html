<!-- History View -->
<div class="container mx-auto px-4 py-8">
    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold text-white">Session History</h1>
    </div>

    <!-- Filters -->
    <div class="flex flex-wrap gap-4 mb-8">
        <div class="flex-1 min-w-[200px]">
            <select id="dateRange" class="w-full bg-gray-800/50 backdrop-blur-lg rounded-lg px-4 py-2 text-white border border-white/10">
                <option value="all">All Time</option>
                <option value="month">This Month</option>
                <option value="week">This Week</option>
                <option value="today">Today</option>
            </select>
        </div>
        <div class="flex-1 min-w-[200px]">
            <select id="sortBy" class="w-full bg-gray-800/50 backdrop-blur-lg rounded-lg px-4 py-2 text-white border border-white/10">
                <option value="date">Date</option>
                <option value="force">Max Force</option>
                <option value="count">Punch Count</option>
                <option value="duration">Duration</option>
            </select>
        </div>
    </div>

    <!-- Sessions List -->
    <div id="sessionsList" class="space-y-4">
        <!-- Session cards will be inserted here -->
    </div>
</div>
